[package]
name = "songnest-accounts"
version = "0.1.0-alpha.2"
license.workspace = true
repository.workspace = true
description = "Songnest accounts and sync API (sign-up/sign-in, liked-songs sync). No music handling."
authors.workspace = true
edition = "2024"

[[bin]]
name = "songnest-accounts"
path = "src/main.rs"

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true

axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "limit"] }
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "tls-rustls", "uuid", "chrono", "migrate"] }
argon2 = "0.5"
jsonwebtoken = "9"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
reqwest = { workspace = true }
