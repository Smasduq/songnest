[package]
name = "songnest-server"
version = "0.1.0-alpha.2"
license.workspace = true
repository.workspace = true
description.workspace = true
authors.workspace = true
edition = "2024"

[features]
default = []
# On-device yt-dlp backend (SongnestPy: embedded CPython on Android,
# reached over JNI). The phone build enables this; desktop is yt-dlp only.
songnestpy = ["songnest-extract/songnestpy"]

[dependencies]
songnest-extract = { path = "../extract", version = "0.1.0-alpha.2" }
tokio.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true

lofty = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors"] }
sha2 = "0.10"
hex = "0.4"
