[package]
name = "songnest-extract"
version = "0.1.0"
license.workspace = true
repository.workspace = true
description.workspace = true
authors.workspace = true
edition = "2021"

[features]
default = []
# Pure-Rust YouTube extraction (rustypipe/Innertube). Off by default so the
# main build never pulls it in.
rustypipe = ["dep:rustypipe", "dep:rquickjs-sys"]

[dependencies]
tokio = { version = "1", features = ["rt", "macros", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-webpki-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
async-trait = "0.1"
rustypipe = { version = "0.11", optional = true, default-features = false, features = ["rustls-tls-native-roots"] }
# Enables rquickjs-sys/bindgen via feature unification (needed for Android,
# for which rquickjs-sys ships no pre-generated bindings).
rquickjs-sys = { version = "0.9", optional = true, features = ["bindgen"] }
