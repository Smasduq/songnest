[package]
name = "songnest-extract"
version = "0.1.0-alpha.2"
license.workspace = true
repository.workspace = true
description.workspace = true
authors.workspace = true
edition = "2021"

[features]
default = []
# On-device yt-dlp backend (embedded CPython on Android, reached over JNI).
# Off by default so desktop builds never pull the bridge in.
songnestpy = []

[dependencies]
tokio = { version = "1", features = ["rt", "macros", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-webpki-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
async-trait = "0.1"

# JNI bridge to Chaquopy's interpreter; Android only (the module compiles to
# a clean "Android-only" stub everywhere else, see songnestpy.rs).
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"
