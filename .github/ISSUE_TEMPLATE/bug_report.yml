name: Bug report
description: Something in Songnest isn't working right (please glance at the open issues first in case it's already reported)
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What went wrong?
      description: One or two sentences, plus what you expected instead.
      placeholder: Playback stops a few seconds into every song.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps so we can see it happen too.
      placeholder: |
        1. Open Songnest
        2. Search for a song
        3. Press play
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Android
        - iOS
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Songnest version
      placeholder: v0.2.0 (see App updates page, or the download filename)
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: Screenshots, screen recording, or error output
      description: Only if it's easy for you.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "Songnest doesn't write a log file, but output helps — Android: `adb logcat | grep SongnestPy`; desktop: launch the app from a terminal and copy what appears. Paste it here if you managed to."
      render: shell
    validations:
      required: false
