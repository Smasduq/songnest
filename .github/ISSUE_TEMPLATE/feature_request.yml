name: Feature request
description: Tell us what you'd like Songnest to do (a quick look at open issues first avoids duplicates)
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: What were you trying to do when you felt something was missing?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Songnest to do?
      description: Describe your idea the way you'd explain it to a friend.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Anything else that would solve it for you, even partly.
    validations:
      required: false
