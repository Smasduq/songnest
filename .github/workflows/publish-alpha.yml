name: 'publish-alpha'

# Alpha release for Songnest v0.1.0-alpha.2
# Triggers on tag push like `v0.1.0-alpha.2`, or manually via workflow_dispatch.
# All jobs upload to the SAME GitHub release (tauri-action finds it by tagName).
on:
  push:
    tags:
      - 'v0.1.0-alpha.*'
  workflow_dispatch: {}

jobs:
  publish-desktop:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # Arm (M1+)
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest' # Intel
            args: '--target x86_64-apple-darwin'
          # Ubuntu 24.04: modern bundled WebKit (icu 74 era). 22.04's WebKit
          # aborts on current Mesa/Wayland hosts — see errors.md.
          - platform: 'ubuntu-24.04'
            args: ''
          - platform: 'windows-latest'
            # MSI rejects the alpha prerelease tag (must be numeric-only),
            # so ship NSIS only for pre-releases.
            args: '-b nsis'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: install frontend dependencies
        working-directory: web
        run: npm ci

      - name: build sidecar (songnest)
        shell: bash
        run: |
          cargo build --release -p songnest
          mkdir -p web/src-tauri/bin
          if [ -f target/release/songnest.exe ]; then
            cp target/release/songnest.exe web/src-tauri/bin/songnest.exe
            cp target/release/songnest.exe web/src-tauri/bin/songnest
          else
            cp target/release/songnest web/src-tauri/bin/songnest
          fi
          ls -la web/src-tauri/bin

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: web
          tagName: v0.1.0-alpha.2
          releaseName: 'Songnest v0.1.0-alpha.2'
          releaseBody: |
            Alpha release — expect rough edges. See errors.md in the repo for known issues (YouTube sign-in untested, on-device yt-dlp throttling).
            Desktop bundles for macOS (arm64 + x64), Linux, Windows.
          releaseDraft: false
          prerelease: true
          retryAttempts: 2
          args: ${{ matrix.args }}

  publish-android:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # setup-android@v3 is broken against current cmdline-tools (it tries to
      # install the long-removed `tools` package and dies), so drive
      # sdkmanager directly. Versions mirror a known-good local SDK.
      - name: setup Android SDK
        run: |
          TOOLS="$(ls -d /usr/local/lib/android/sdk/cmdline-tools/*/ | sort -V | tail -1)bin/sdkmanager"
          yes | "$TOOLS" --licenses > /dev/null
          "$TOOLS" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: install Rust stable + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: install frontend dependencies
        working-directory: web
        run: npm ci

      # In-process backend (android-backend feature: SongnestPy, yt-dlp on
      # embedded CPython — no sidecar, no subprocess on device).
      # Chaquopy needs a host Python matching the device version (3.11).
      - name: setup Python 3.11 (Chaquopy host)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Release signing: keystore.properties is gitignored and written here
      # from secrets (Tauri docs "Android Code Signing"). Local builds
      # without it stay unsigned, as before.
      - name: setup Android signing
        working-directory: web/src-tauri/gen/android
        run: |
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" > keystore.properties
          echo "password=${{ secrets.ANDROID_KEY_PASSWORD }}" >> keystore.properties
          base64 -d <<< "${{ secrets.ANDROID_KEY_BASE64 }}" > "$RUNNER_TEMP/release.keystore"
          echo "storeFile=$RUNNER_TEMP/release.keystore" >> keystore.properties

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONGNEST_BUILD_PYTHON: ${{ env.pythonLocation }}/bin/python
        with:
          projectPath: web
          tagName: v0.1.0-alpha.2
          releaseName: 'Songnest v0.1.0-alpha.2'
          releaseBody: |
            Alpha release — Android APK (on-device yt-dlp via SongnestPy).
          releaseDraft: false
          prerelease: true
          retryAttempts: 2
          mobile: 'android'
          args: '--apk -f android-backend'

