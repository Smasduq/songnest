name: 'publish-alpha'

# Release builds for Songnest.
# Triggers on version tag push like `v0.3.1`, or manually via workflow_dispatch.
# All jobs upload to the SAME GitHub release (tauri-action finds it by tagName).
on:
  push:
    tags:
      - 'v0.3.1'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v0.3.1)'
        required: true
        default: 'v0.3.1'

jobs:
  publish-desktop:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # Arm (M1+)
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest' # Intel
            args: '--target x86_64-apple-darwin'
          # Ubuntu 24.04: modern bundled WebKit (icu 74 era). 22.04's WebKit
          # aborts on current Mesa/Wayland hosts — see errors.md.
          - platform: 'ubuntu-24.04'
            args: ''
          - platform: 'windows-latest'
            # MSI rejects the alpha prerelease tag (must be numeric-only),
            # so ship NSIS only for pre-releases.
            args: '-b nsis'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav gstreamer1.0-tools

      - name: install frontend dependencies
        working-directory: web
        run: npm ci

      - name: build sidecar (songnest)
        shell: bash
        run: |
          cargo build --release -p songnest
          mkdir -p web/src-tauri/bin
          if [ -f target/release/songnest.exe ]; then
            cp target/release/songnest.exe web/src-tauri/bin/songnest.exe
            cp target/release/songnest.exe web/src-tauri/bin/songnest
          else
            cp target/release/songnest web/src-tauri/bin/songnest
          fi
          ls -la web/src-tauri/bin

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: web
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'Songnest ${{ github.event.inputs.tag || github.ref_name }}'
          releaseBody: |
            Publishing — full notes are attached by the release-notes job from CHANGELOG.md.
            Desktop bundles for macOS (arm64 + x64), Linux, Windows.
          releaseDraft: false
          prerelease: false
          retryAttempts: 2
          args: ${{ matrix.args }}

  publish-android:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # setup-android@v3 is broken against current cmdline-tools (it tries to
      # install the long-removed `tools` package and dies), so drive
      # sdkmanager directly. Versions mirror a known-good local SDK.
      - name: setup Android SDK
        run: |
          TOOLS="$(ls -d /usr/local/lib/android/sdk/cmdline-tools/*/ | sort -V | tail -1)bin/sdkmanager"
          yes | "$TOOLS" --licenses > /dev/null
          "$TOOLS" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: install Rust stable + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: install frontend dependencies
        working-directory: web
        run: npm ci

      # In-process backend (android-backend feature: SongnestPy, yt-dlp on
      # embedded CPython — no sidecar, no subprocess on device).
      # Chaquopy needs a host Python matching the device version (3.11).
      - name: setup Python 3.11 (Chaquopy host)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Decode the signing key to a runner-local file; passwords are passed
      # to Gradle through the step environment rather than shell interpolation.
      - name: setup Android signing
        working-directory: web/src-tauri/gen/android
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONGNEST_BUILD_PYTHON: ${{ env.pythonLocation }}/bin/python
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        with:
          projectPath: web
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'Songnest ${{ github.event.inputs.tag || github.ref_name }}'
          releaseBody: |
            Publishing — full notes are attached by the release-notes job from CHANGELOG.md.
          releaseDraft: false
          prerelease: false
          retryAttempts: 2
          mobile: 'android'
          args: '--apk -f android-backend'

  # In-place desktop updates: build latest.json from the signed updater
  # bundles (*.sig siblings) that tauri-action uploaded, and attach it to
  # the same release. The app's updater endpoint reads
  # .../releases/latest/download/latest.json. Platforms without a signed
  # bundle are omitted (those devices keep the manual download flow).
  publish-updater-json:
    needs: [publish-desktop]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: build and upload latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/sigs && cd /tmp/sigs
          gh release download "$TAG" --repo "$REPO" --pattern '*.sig' --clobber
          META="$(gh release view "$TAG" --repo "$REPO" --json tagName,publishedAt,body)"
          python3 - "$META" <<'EOF'
          import json, os, sys

          meta = json.loads(sys.argv[1])
          tag = meta["tagName"]
          base = f"https://github.com/{os.environ['REPO']}/releases/download/{tag}"

          def sig_for(bundle: str) -> str | None:
              p = f"/tmp/sigs/{bundle}.sig"
              try:
                  with open(p) as f:
                      return f.read().strip()
              except OSError:
                  return None

          names = sorted(os.listdir("/tmp/sigs"))
          bundles = [n[:-4] for n in names if n.endswith(".sig")]

          def pick(pred):
              for b in bundles:
                  if pred(b):
                      return b
              return None

          low = lambda b: b.lower()
          mac_arm = pick(lambda b: b.endswith(".app.tar.gz") and ("aarch64" in low(b) or "arm64" in low(b)))
          mac_x64 = pick(lambda b: b.endswith(".app.tar.gz") and ("x86_64" in low(b) or "x64" in low(b) or "intel" in low(b)))
          # Fallback: unmarked dmg goes to the missing arch slot.
          unmarked = [b for b in bundles if b.endswith(".app.tar.gz") and b not in (mac_arm, mac_x64)]
          if mac_arm is None and unmarked:
              mac_arm = unmarked.pop(0)
          if mac_x64 is None and unmarked:
              mac_x64 = unmarked.pop(0)
          linux = pick(lambda b: b.endswith(".AppImage.tar.gz"))
          windows = pick(lambda b: b.endswith(".nsis.zip")) or pick(lambda b: b.endswith(".msi.zip"))

          platforms = {}
          for key, bundle in (
              ("darwin-aarch64", mac_arm),
              ("darwin-x86_64", mac_x64),
              ("linux-x86_64", linux),
              ("windows-x86_64", windows),
          ):
              if bundle is None:
                  print(f"::warning::no signed bundle for {key}")
                  continue
              sig = sig_for(bundle)
              if not sig:
                  print(f"::warning::missing sig for {bundle}")
                  continue
              platforms[key] = {"signature": sig, "url": f"{base}/{bundle}"}

          if not platforms:
              sys.exit("no signed updater bundles found — refusing to publish latest.json")

          latest = {
              "version": tag,
              "notes": (meta.get("body") or "")[:4000],
              "pub_date": meta.get("publishedAt"),
              "platforms": platforms,
          }
          with open("/tmp/latest.json", "w") as f:
              json.dump(latest, f, indent=2)
          print(json.dumps({k: v["url"] for k, v in platforms.items()}, indent=2))
          EOF
          gh release upload "$TAG" /tmp/latest.json --repo "$REPO" --clobber

  # Release notes are generated, never hardcoded: the CHANGELOG.md section
  # for this tag, plus any commits that landed after the tag (appended at
  # the bottom under "Late changes"). Re-running the workflow refreshes
  # the notes, so late fixes are never lost from the release page.
  publish-release-notes:
    needs: [publish-desktop, publish-android, publish-updater-json]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: compose and attach release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          python3 - <<'EOF' > /tmp/notes.md
          import os, re, subprocess
          tag = os.environ["TAG"]
          version = tag.lstrip("v")
          text = open("CHANGELOG.md").read()
          m = re.search(rf"^## v?{re.escape(version)}\b.*?(?=^## |\Z)", text, re.M | re.S)
          section = m.group(0).strip() if m else f"## {version}"
          print(f"Songnest {version}")
          print()
          print(section)
          log = subprocess.run(
              ["git", "log", f"{tag}..HEAD", "--oneline", "--no-decorate"],
              capture_output=True, text=True,
          ).stdout.strip()
          if log:
              print()
              print("### Late changes")
              print()
              print("Commits that landed after the tag was cut:")
              print()
              for line in log.splitlines():
                  print(f"- {line}")
          EOF
          cat /tmp/notes.md
          gh release edit "$TAG" --repo "$REPO" --title "Songnest $TAG" --notes-file /tmp/notes.md
