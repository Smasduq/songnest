name: publish-crates

# Publishes songnest crates to crates.io in dependency order:
# songnest-core -> songnest-extract -> songnest-server -> songnest
# (`cargo install songnest` installs the backend/server binary.)
#
# Requires repo secret CARGO_REGISTRY_TOKEN (a crates.io API token).
# Run manually after tagging a release: Actions -> publish-crates -> Run.

on:
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Dry-run and publish each crate in dependency order: a --dry-run
      # resolves dependencies from the crates.io index, so the whole batch
      # cannot be dry-run up front (each crate needs its deps already
      # published when it is checked).
      - name: publish songnest-core
        run: |
          cargo publish --dry-run -p songnest-core
          cargo publish -p songnest-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: publish songnest-extract
        run: |
          cargo publish --dry-run -p songnest-extract
          for i in 1 2 3 4 5 6; do
            cargo publish -p songnest-extract && break
            echo "retry $i/6 in 60s (waiting for crates.io index)..."
            sleep 60
          done
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: publish songnest-server
        run: |
          cargo publish --dry-run -p songnest-server
          for i in 1 2 3 4 5 6; do
            cargo publish -p songnest-server && break
            echo "retry $i/6 in 60s (waiting for crates.io index)..."
            sleep 60
          done
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: publish songnest
        run: |
          cargo publish --dry-run -p songnest
          for i in 1 2 3 4 5 6; do
            cargo publish -p songnest && break
            echo "retry $i/6 in 60s (waiting for crates.io index)..."
            sleep 60
          done
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
