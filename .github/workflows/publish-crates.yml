name: publish-crates

# Publishes songnest crates to crates.io in dependency order:
# songnest-extract -> songnest-server -> songnest-cli
# (`cargo install songnest-cli` installs the backend/server binary.)
# songnest-core is intentionally skipped: nothing depends on it yet.
#
# Requires repo secret CARGO_REGISTRY_TOKEN (a crates.io API token).
# Run manually after tagging a release: Actions -> publish-crates -> Run.

on:
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: dry-run all crates first
        run: |
          cargo publish --dry-run -p songnest-extract
          cargo publish --dry-run -p songnest-server
          cargo publish --dry-run -p songnest-cli

      - name: publish songnest-extract
        run: cargo publish -p songnest-extract
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: publish songnest-server
        run: |
          for i in 1 2 3 4 5 6; do
            cargo publish -p songnest-server && break
            echo "retry $i/6 in 60s (waiting for crates.io index)..."
            sleep 60
          done
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: publish songnest-cli
        run: |
          for i in 1 2 3 4 5 6; do
            cargo publish -p songnest-cli && break
            echo "retry $i/6 in 60s (waiting for crates.io index)..."
            sleep 60
          done
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
