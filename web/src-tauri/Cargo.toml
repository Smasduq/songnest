[package]
name = "songnest"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
songnest-server = { path = "../../crates/server" }
tokio = { version = "1", features = ["full"] }
tauri-plugin-opener = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Phone backend: in-process songnest-server with the pure-Rust YouTube
# extractor (no yt-dlp on Android). Desktop builds skip this.
android-backend = ["songnest-server/rustypipe"]
