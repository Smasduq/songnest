[workspace]
resolver = "2"
members = ["crates/core", "crates/cli"]
exclude = ["web/src-tauri"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
