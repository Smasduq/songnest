[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/extract", "crates/server"]
exclude = ["web/src-tauri"]

[workspace.package]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Smasduq/songnest"
description = "Songnest is a music library and player with a pluggable source system."
authors = ["Smasduq"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-webpki-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

# Local fixes on top of rustypipe 0.11.4 (see patches/rustypipe):
# visitor-data fetch returns Err instead of panicking; missing
# deobfuscation data falls back to cipher-free formats instead of
# failing the whole resolve. Inert unless the `rp` feature is enabled.
[patch.crates-io]
rustypipe = { path = "patches/rustypipe" }
